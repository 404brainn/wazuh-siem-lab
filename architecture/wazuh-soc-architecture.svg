  <text x="905" y="182" text-anchor="middle" font-family="Arial" font-size="15" fill="#333">Wazuh Manager</text>
  <text x="905" y="207" text-anchor="middle" font-family="Arial" font-size="15" fill="#333">Wazuh SIEM Stack</text>
  <text x="905" y="228" text-anchor="middle" font-family="Arial" font-size="13" fill="#555">192.168.1.74</text>

  <line x1="320" y1="180" x2="425" y2="180" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="372" y="164" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">Nmap / controlled traffic</text>

  <line x1="675" y1="180" x2="780" y2="180" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="728" y="164" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">Telemetry</text>

  <line x1="195" y1="240" x2="195" y2="385" stroke="#555" stroke-width="2" stroke-dasharray="7,6" marker-end="url(#arrowGray)"/>
  <line x1="550" y1="240" x2="550" y2="385" stroke="#555" stroke-width="2" stroke-dasharray="7,6" marker-end="url(#arrowGray)"/>
  <line x1="905" y1="240" x2="905" y2="385" stroke="#555" stroke-width="2" marker-end="url(#arrowGray)"/>

  <rect x="115" y="385" width="170" height="80" rx="10" fill="white" stroke="#555" stroke-width="2"/>
