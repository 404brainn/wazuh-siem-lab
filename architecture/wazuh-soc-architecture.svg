  <text x="195" y="228" text-anchor="middle" font-family="Arial" font-size="13" fill="#555">192.168.1.71</text>

  <rect x="425" y="120" width="250" height="120" rx="12" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <text x="550" y="155" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#111">Windows 11</text>
  <text x="550" y="182" text-anchor="middle" font-family="Arial" font-size="15" fill="#333">Monitored Endpoint</text>
  <text x="550" y="207" text-anchor="middle" font-family="Arial" font-size="15" fill="#333">Wazuh Agent</text>
  <text x="550" y="228" text-anchor="middle" font-family="Arial" font-size="13" fill="#555">192.168.1.70</text>

  <rect x="780" y="120" width="250" height="120" rx="12" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
