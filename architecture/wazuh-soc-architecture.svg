  <line x1="905" y1="465" x2="905" y2="535" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="720" y="535" width="370" height="55" rx="10" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
