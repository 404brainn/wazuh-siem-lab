  <text x="555" y="438" text-anchor="middle" font-family="Arial" font-size="13" fill="#444">Security • FIM • Firewall</text>

  <rect x="825" y="385" width="170" height="80" rx="10" fill="white" stroke="#555" stroke-width="2"/>
